name: Lint and Test Charts

on:
  workflow_call:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - master

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "charts<<EOF" >> "$GITHUB_OUTPUT"
            echo "$changed" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --target-branch ${{ github.event.repository.default_branch }}

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --target-branch ${{ github.event.repository.default_branch }}

  lint-artifacthub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get changed charts
        id: changed-charts
        run: |
          # Get all chart directories
          charts=$(find charts -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | tr '\n' ' ')
          echo "charts=$charts" >> "$GITHUB_OUTPUT"

      - name: Run ah lint on all charts
        env:
          # renovate: docker=artifacthub/ah
          AH_VERSION: v1.23.0@sha256:e5d2a2cdef85aac4928e8176ffaad24746c5fe961d64ff6856f7222957095356
        run: |
          for chart_dir in charts/*/; do
            if [ -f "$chart_dir/Chart.yaml" ]; then
              echo "Linting chart: $chart_dir"
              docker run --rm -v "$(pwd)/$chart_dir:/chart" "artifacthub/ah:$AH_VERSION" ah lint /chart
            fi
          done

  version-plan:
    # Replaces ct's check-version-increment: fails a PR that changes a chart
    # when neither its title nor its commits map to a version bump. The
    # bumper's own release PRs are exempt; their chore(release) title maps to
    # no bump by design.
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'chore/release-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Plan chart versions
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          # Default `run` shell lacks pipefail; without it tee masks the exit code.
          set -o pipefail
          git fetch --tags --quiet
          ./scripts/chart-version.sh plan | tee -a "$GITHUB_STEP_SUMMARY"
